name: Generate 3D Contribution Graph
on:
  # 3時間ごと（UTC）に自動実行
  schedule:
    - cron: "47 */3 * * *"
  # 手動実行も可能にする
  workflow_dispatch:
  # mainブランチへのpushでも実行
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph
    steps:
      - uses: actions/checkout@v4
      - name: Generate 3D Graph (Attempt 1)
        id: graph_attempt_1
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # プライベートリポジトリを含める場合はPERSONAL_ACCESS_TOKENを使用
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Generate 3D Graph (Attempt 2)
        id: graph_attempt_2
        if: steps.graph_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Generate 3D Graph (Attempt 3)
        id: graph_attempt_3
        if: steps.graph_attempt_1.outcome == 'failure' && steps.graph_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Fail if all attempts failed
        if: steps.graph_attempt_1.outcome == 'failure' && steps.graph_attempt_2.outcome == 'failure' && steps.graph_attempt_3.outcome == 'failure'
        run: exit 1
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update 3D contribution graph"
          git push
